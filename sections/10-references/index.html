<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>References | My Globalization Atlas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../shared/css/global.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- REFERENCES — the central source list for the whole atlas.
       The entries are NOT typed here. They come from js/references-data.js and are drawn by
       js/script.js, grouped by project section, alphabetical, in APA 7 format.
       To add or change a source, edit js/references-data.js only. -->
  <main class="page atlas-bg sec" id="secPage">

    <header class="sec__header">
      <p class="sec__kicker">My Globalization Atlas</p>
      <h1 class="sec__title">References</h1>
      <p class="sec__counter">11 / 11</p>
      <p class="sec__quote">The source archive of the atlas: every credible source used to research and build it.</p>
      <p class="draft-tag">Sources are added section by section</p>
    </header>

    <div class="sec__content">

      <!-- TOOLBAR: section filter (only appears when 2+ sections have sources) + source count -->
      <div class="toolbar">
        <div class="filters" id="filters" role="group" aria-label="Filter sources by section" hidden></div>
        <div class="toolbar__row">
          <p class="toolbar__count" id="count" aria-live="polite"></p>
        </div>
      </div>

      <!-- Sections and source cards are built here by js/script.js -->
      <div class="cats" id="cats">
        <noscript><p class="empty">Turn on JavaScript to see the reference list.</p></noscript>
      </div>

    </div>

    <!-- Shared navigation (built by shared/js/nav.js) -->
    <div data-atlas-nav="references"></div>
  </main>

  <script src="../../shared/js/nav.js"></script>
  <script src="js/references-data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
