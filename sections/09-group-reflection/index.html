<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>So, What? | My Globalization Atlas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../shared/css/global.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- GROUP REFLECTION (draft / placeholder content) -->
  <main class="page atlas-bg sec" id="secPage">

    <header class="sec__header">
      <p class="sec__kicker">My Globalization Atlas</p>
      <h1 class="sec__title">So, What?</h1>
      <p class="sec__counter">10 / 10</p>
      <p class="sec__quote">After exploring the different connections of globalization, this is where the group reflects on what they discovered.</p>
      <p class="draft-tag">Draft content &mdash; to be added</p>
    </header>

    <div class="sec__content">

      <!-- FIVE QUESTION CARDS. Answers live in js/script.js (QUESTIONS). -->
      <ol class="cards" id="cards">
        <li class="card" data-q="0">
          <button class="card__head" type="button" aria-expanded="false" aria-controls="panel0" id="head0">
            <span class="card__num">01</span>
            <span class="card__q">What surprised you most about globalization?</span>
            <span class="card__sign" aria-hidden="true">+</span>
          </button>
          <div class="card__panel" id="panel0" role="region" aria-labelledby="head0" hidden></div>
        </li>
        <li class="card" data-q="1">
          <button class="card__head" type="button" aria-expanded="false" aria-controls="panel1" id="head1">
            <span class="card__num">02</span>
            <span class="card__q">Which example best shows how connected the Philippines is to the world?</span>
            <span class="card__sign" aria-hidden="true">+</span>
          </button>
          <div class="card__panel" id="panel1" role="region" aria-labelledby="head1" hidden></div>
        </li>
        <li class="card" data-q="2">
          <button class="card__head" type="button" aria-expanded="false" aria-controls="panel2" id="head2">
            <span class="card__num">03</span>
            <span class="card__q">What is one major opportunity globalization gives the Philippines?</span>
            <span class="card__sign" aria-hidden="true">+</span>
          </button>
          <div class="card__panel" id="panel2" role="region" aria-labelledby="head2" hidden></div>
        </li>
        <li class="card" data-q="3">
          <button class="card__head" type="button" aria-expanded="false" aria-controls="panel3" id="head3">
            <span class="card__num">04</span>
            <span class="card__q">What is one major challenge globalization creates for the Philippines?</span>
            <span class="card__sign" aria-hidden="true">+</span>
          </button>
          <div class="card__panel" id="panel3" role="region" aria-labelledby="head3" hidden></div>
        </li>
        <li class="card" data-q="4">
          <button class="card__head" type="button" aria-expanded="false" aria-controls="panel4" id="head4">
            <span class="card__num">05</span>
            <span class="card__q">How did your understanding of globalization change after exploring this atlas?</span>
            <span class="card__sign" aria-hidden="true">+</span>
          </button>
          <div class="card__panel" id="panel4" role="region" aria-labelledby="head4" hidden></div>
        </li>
      </ol>

      <!-- FINAL TAKEAWAY — replace .takeaway__value when the group is ready -->
      <section class="takeaway" id="takeaway" aria-labelledby="takeawayTitle">
        <h2 class="takeaway__title" id="takeawayTitle">Our Takeaway</h2>
        <p class="takeaway__value">[GROUP FINAL TAKEAWAY GOES HERE]</p>
      </section>

    </div>

    <!-- Shared navigation (built by shared/js/nav.js) -->
    <div data-atlas-nav="group-reflection"></div>
  </main>

  <script src="../../shared/js/nav.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
