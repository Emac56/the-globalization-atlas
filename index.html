<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Globalization Atlas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />

  <!-- Shared styles first, then this page's styles -->
  <link rel="stylesheet" href="shared/css/global.css" />
  <link rel="stylesheet" href="sections/cover/css/cover.css?v=narrator1" />
</head>
<body>
  <!-- PAGE 1: COVER -->
  <main class="page cover">

    <!-- Background: palitan lang ang assets/images/backgrounds/cover-bg.webp (nasa sections/cover/css/cover.css) -->
    <div class="cover__bg" aria-hidden="true"></div>
    <div class="cover__sparkles" id="sparkles" aria-hidden="true"></div>

    <section class="pixel-box cover__box">
      <h1 class="cover__title">The<br />Globalization<br />Atlas</h1>

      <div class="cover__info">
        <div class="cover__col">
          <p>Section: BSIT-2C</p>
          <p>Date: Oct, 7 2026</p>
          <p>Instructor: Ma'am Leslyn Dela Cruz</p>
        </div>
        <div class="cover__col">
          <p>Members:</p>
          <p>Jaymark Vicente</p>
          <p>Jaymark Catinggan</p>
          <p>Rey Dela Cruz</p>
          <p>Leopando Kayzer</p>
          <p>Mayundang Richard</p>
        </div>
      </div>
    </section>

    <!-- NARRATOR INTRO (prototype): a stationary pixel character + dialogue box.
         Text lines and speech logic live in sections/cover/js/cover.js -->
    <section class="narrator" id="narrator" aria-label="Introduction narrator">
      <button class="narrator__char" id="charBtn" type="button" aria-describedby="charHint"
              aria-label="Atlas Guide, the narrator. Click to learn more about this project.">
        <svg class="narrator__sprite" id="charSprite" viewBox="0 0 16 16" aria-hidden="true" focusable="false" shape-rendering="crispEdges"></svg>
        <span class="narrator__hint" id="charHint">Click me</span>
      </button>

      <div class="dialog pixel-box" id="dialog">
        <p class="dialog__top">
          <span class="dialog__name">Atlas Guide</span>
          <span class="dialog__progress" id="dialogProgress">Line 1 of 4</span>
        </p>
        <p class="dialog__done" id="dialogDone" hidden>&#10003; Introduction complete!</p>
        <p class="dialog__text" id="dialogText"></p>

        <p class="dialog__status" id="narrStatus" role="status">
          <span class="speaker" id="speaker" aria-hidden="true"><i></i><i></i><i></i></span>
          <span id="narrStatusText">Starting narration&hellip;</span>
        </p>

        <div class="dialog__btns" id="introBtns">
          <button class="pixel-btn dlg-btn" id="continueBtn" type="button" disabled>Continue</button>
          <button class="pixel-btn dlg-btn" id="skipBtn" type="button">Skip</button>
          <button class="pixel-btn dlg-btn dlg-btn--ghost" id="replayBtn" type="button" disabled>Replay voice</button>
        </div>
        <div class="dialog__btns" id="doneBtns" hidden>
          <button class="pixel-btn dlg-btn dlg-btn--go" id="exploreBtn" type="button">Start Exploring</button>
        </div>
      </div>
    </section>

    <button class="pixel-btn cover__start" id="startBtn" type="button">Start Atlas</button>
  </main>

  <script src="sections/cover/js/cover.js?v=narrator1"></script>
</body>
</html>
